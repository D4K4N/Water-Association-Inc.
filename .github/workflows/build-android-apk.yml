name: Build Hybrid Android APKs (Original + AI Scanner Edition)

on:
  push:
    branches: [ main, ai-scanner ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hybrid-apk:
    name: Build Original APK & AI Scanner APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21 (Temurin for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Automated Verification & Billing Test Suite
        run: node test-suite.js

      - name: Install Capacitor Android Builder
        run: npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6

      # ─── 1. BUILD ORIGINAL PRODUCTION APK (Dicklum-Water-Billing.apk) ───
      - name: Assemble Original Production Bundle (./www)
        run: node scripts/build-web.js

      - name: Generate Android Project for Original App
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Inject Permissions for Original App
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's|<application|<!-- GPS, Bluetooth Xprinter XP-P300 & Network Sync Permissions -->\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi

      - name: Compile Dicklum-Water-Billing.apk (Original App)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Save Dicklum-Water-Billing.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Dicklum-Water-Billing.apk
          ls -lh ./Dicklum-Water-Billing.apk

      # ─── 2. BUILD SEPARATE AI SCANNER EDITION APK (If ai-scanner/ exists on branch) ───
      - name: Build Separate AI Scanner APK if Present
        run: |
          if [ -d "ai-scanner" ]; then
            rm -rf www android
            cp -r ai-scanner www
            node -e '
              const fs = require("fs");
              const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
              cfg.appId = "com.dicklum.waterbilling.ai";
              cfg.appName = "Dicklum Water AI";
              cfg.webDir = "www";
              fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
            '
            npx cap add android
            npx cap sync android
            git checkout capacitor.config.json
            MANIFEST="android/app/src/main/AndroidManifest.xml"
            if [ -f "$MANIFEST" ]; then
              sed -i 's|<application|<!-- Camera, Torch Flashlight, GPS & Bluetooth Permissions -->\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.FLASHLIGHT" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.flash" android:required="false" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application android:usesCleartextTraffic="true"|' "$MANIFEST"
            fi
            (cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon)
            cp android/app/build/outputs/apk/debug/app-debug.apk ./Dicklum-Water-AI-Scanner.apk
            ls -lh ./Dicklum-Water-AI-Scanner.apk
          else
            echo "On main branch (no ai-scanner/ directory) — skipping AI Scanner APK build."
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dicklum-Water-APKs
          path: |
            ./Dicklum-Water-Billing.apk
            ./Dicklum-Water-AI-Scanner.apk
          if-no-files-found: ignore
          retention-days: 90

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dicklum Water Association — Official & AI Scanner APKs (Latest)"
          body: |
            ### 1. Original Production App: `Dicklum-Water-Billing.apk`
            - **Package ID**: `com.dicklum.waterbilling` (App Name: **Dicklum Water**)
            - Your untouched stable production app.

            ### 2. New Offline AI Camera Scanner Edition: `Dicklum-Water-AI-Scanner.apk`
            - **Package ID**: `com.dicklum.waterbilling.ai` (App Name: **Dicklum Water AI**)
            - Installs as a **separate second app** on your phone (never overwrites your original app!).
          files: |
            ./Dicklum-Water-Billing*.apk
            ./Dicklum-Water-AI-Scanner*.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
